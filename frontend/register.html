<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="portfolia-api-base" content="" />
    <title>Register | The Portfolia</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script defer src="js/app.js"></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <a class="brand" href="index.html">The Portfolia</a>
            <div class="nav-links">
                <a href="login.html" class="button-link secondary">Login</a>
            </div>
        </nav>
    </header>

    <main class="form-wrap">
        <div class="auth-card">
            <h2>Create account</h2>
            <form id="register-form">
                <label for="full_name">Full name</label>
                <input id="full_name" name="full_name" type="text" placeholder="Your full name" required />

                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="name@example.com" required />

                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Minimum 8 characters" required />

                <label for="user_type">Role</label>
                <select id="user_type" name="user_type">
                    <option value="student">Student</option>
                    <option value="college_admin">College</option>
                    <option value="company">Company</option>
                    <option value="investor">Investor</option>
                </select>

                <div class="form-actions">
                    <button type="submit">Register</button>
                </div>
                <p data-message class="form-note"></p>
            </form>
            <div class="form-note">Already have an account? <a href="login.html">Login</a></div>
        </div>
    </main>
</body>
</html>
