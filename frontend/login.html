<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="portfolia-api-base" content="" />
    <title>Login | The Portfolia</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script defer src="js/app.js"></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <a class="brand" href="index.html">The Portfolia</a>
            <div class="nav-links">
                <a href="register.html" class="button-link">Create account</a>
            </div>
        </nav>
    </header>

    <main class="form-wrap">
        <div class="auth-card">
            <h2>Welcome back</h2>
            <form id="login-form">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="name@example.com" required />

                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Enter password" required />

                <div class="form-actions">
                    <button type="submit">Login</button>
                </div>
                <p data-message class="form-note"></p>
            </form>
            <div class="form-note">Need an account? <a href="register.html">Register here</a></div>
            <div class="form-note"><a href="admin/index.html">Administration</a></div>
        </div>
    </main>
</body>
</html>
